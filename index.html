<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa da Resenha</title>
<meta name="description" content="Quem pagou o futebol da Resenha Jaguariúna: mensais e avulsos, mês a mês.">
<meta name="theme-color" content="#0b0a08">
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="fonts/fontes.css">
<style>
/* Layout: cabeçalho com o escudo, placar do mês, duas tabelas (mensais | avulsos) e o histórico. Visual preto e dourado do escudo, tema único. */
:root {
  color-scheme: dark;
  --bg: #0b0a08;
  --surface: #14120e;
  --surface-2: #1b1813;
  --line: #2c271d;
  --line-gold: rgba(212, 170, 72, .35);
  --fg: #f1ece1;
  --muted: #9b9282;
  --gold: #d6ad4c;
  --gold-hi: #f3d784;
  --gold-lo: #9c7428;
  --pago: #4fd189;
  --pago-bg: rgba(79, 209, 137, .16);
  --deve: #ff5d52;
  --deve-bg: rgba(255, 93, 82, .16);
  --font-display: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1200px 500px at 50% -200px, rgba(214, 173, 76, .13), transparent 70%), var(--bg);
  background-color: var(--bg);
  color: var(--fg); font-family: var(--font-body); font-size: 15px; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
}
#app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ouro {
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* Cabeçalho */
.topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px;
  padding-bottom: 20px; border-bottom: 1px solid var(--line-gold); }
.marca { display: flex; align-items: center; gap: 16px; min-width: 0; }
.marca img { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line-gold), 0 10px 30px rgba(214, 173, 76, .18); flex: none; }
.marca h1 { font-size: 34px; font-weight: 700; letter-spacing: .04em; line-height: 1; }
.marca .sub { margin-top: 6px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.direita { display: grid; gap: 8px; justify-items: end; }
.mes-nav { display: flex; align-items: center; gap: 6px; }
.mes-nav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; color: var(--gold); }
.mes-nav button:hover:not(:disabled) { border-color: var(--gold); }
.mes-nav button:disabled { opacity: .3; cursor: default; }
.mes-nav select { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px;
  font-family: var(--font-display); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.acesso { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.acesso .modo { display: inline-flex; align-items: center; gap: 7px; }
.acesso .modo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.acesso .modo.admin::before { background: var(--gold); }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--gold); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* Placar */
.placar { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 1px; background: var(--line-gold);
  border: 1px solid var(--line-gold); border-radius: 16px; overflow: hidden; }
@media (max-width: 820px) { .placar { grid-template-columns: 1fr 1fr; } }
.placar > div { background: var(--surface); padding: 18px 20px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.placar .rot { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.placar .val { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.1; }
.placar .score { font-family: var(--font-display); font-size: 46px; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 12px; }
.placar .score .p { color: var(--pago); } .placar .score .d { color: var(--deve); } .placar .score .x { color: var(--gold); font-size: 28px; }
.barra { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); border-radius: 99px; }
.placar .det { font-size: 12px; color: var(--muted); }

/* Filtros */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 14px; color: var(--muted); }
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--gold); color: #1a1408; border-color: var(--gold); }
.filtros input { flex: 1 1 220px; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: var(--surface); }
.filtros input::placeholder, .add input::placeholder { color: var(--muted); }

/* Tabelas */
.tabelas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 22px; align-items: start; }
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
.painel-cab { padding: 18px 18px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  border-top: 2px solid var(--gold); }
.painel-cab h2 { font-size: 24px; font-weight: 600; letter-spacing: .05em; }
.preco { font-size: 13px; font-weight: 700; color: var(--gold); border: 1px solid var(--line-gold); border-radius: 999px; padding: 4px 12px; background: rgba(214, 173, 76, .06); }
.add { display: flex; gap: 8px; padding: 0 18px 16px; }
.add input { flex: 1; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: var(--bg); }
.add input:focus { border-color: var(--gold); outline: none; }
.add button { height: 42px; padding: 0 18px; border-radius: 10px; border: 0; font-weight: 700;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1408; }
.add button:disabled { opacity: .4; cursor: default; }
.lista { list-style: none; margin: 0; padding: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.lista li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--deve); background: var(--deve-bg); }
.lista li.ok { border-color: var(--pago); background: var(--pago-bg); }
.ava { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display);
  font-size: 15px; font-weight: 600; letter-spacing: .03em; border: 1.5px solid var(--deve); color: var(--deve); background: var(--deve-bg); }
.ava.ok { border-color: var(--pago); color: var(--pago); background: var(--pago-bg); }
.quem { flex: 1; min-width: 0; }
.quem .n { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; color: var(--deve); }
.quem .n.ok { color: var(--pago); }
.quem .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.acoes { display: flex; align-items: center; gap: 6px; flex: none; }
.btn-pago { min-width: 96px; height: 36px; border-radius: 10px; font-weight: 700; font-size: 14px;
  border: 1.5px solid var(--deve); background: transparent; color: var(--deve); }
.btn-pago:hover { background: var(--deve-bg); }
.btn-pago.ok { border-color: var(--pago); background: var(--pago-bg); color: var(--pago); }
.btn-x { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.btn-x:hover { color: var(--deve); border-color: var(--deve); }
.confirma { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; justify-content: flex-end; }
.confirma button { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; }
.confirma .sim { background: var(--deve); border-color: var(--deve); color: #fff; }
.vazio { padding: 28px 18px; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
.rodape { padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2);
  display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.rodape b { color: var(--gold); font-weight: 700; }

/* Histórico */
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-width: 0; }
.hist-wrap { overflow-x: auto; }
.hist table { width: 100%; border-collapse: collapse; min-width: 520px; }
.hist th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 700;
  padding: 10px 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.hist td { padding: 12px 18px; border-bottom: 1px solid var(--line); }
.hist tr:last-child td { border-bottom: 0; }
.hist tr.click { cursor: pointer; }
.hist tr.click:hover td { background: var(--surface-2); }
.hist tr.atual td { background: rgba(214, 173, 76, .07); }
.hist tr.atual td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
.hist .mes { font-weight: 600; }
.hist .mes::first-letter { text-transform: uppercase; }

/* Avisos e login */
.aviso { padding: 12px 16px; border-radius: 12px; background: var(--deve-bg); color: var(--deve); font-weight: 600; border: 1px solid rgba(255, 93, 82, .3); }
.info { color: var(--muted); font-size: 13px; margin: 0; }
.info.centro { text-align: center; }
.login { background: var(--surface); border: 1px solid var(--line-gold); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.login h2 { font-size: 22px; font-weight: 600; letter-spacing: .05em; }
.login ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.5; }
.login a { color: var(--gold-hi); }
.login code { background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
.login .linha { display: flex; gap: 8px; flex-wrap: wrap; }
.login input { flex: 1 1 260px; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: var(--bg); }
.login .entrar { height: 42px; padding: 0 18px; border-radius: 10px; border: 0; font-weight: 700; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1408; }
.login .entrar:disabled { opacity: .4; cursor: default; }
.login .cancela { height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: none; }

@media (max-width: 520px) {
  .marca img { width: 64px; height: 64px; }
  .marca h1 { font-size: 26px; }
  .direita { justify-items: start; }
  .placar .score { font-size: 38px; }
  .placar .val { font-size: 24px; }
  .btn-pago { min-width: 78px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn-pago, .chip, .ava, .quem .n, .lista li { transition: background .15s, color .15s, border-color .15s; }
  .barra i { transition: width .4s ease; }
}
</style>
</head>
<body>
<div id="app"><p class="info">Carregando o caixa…</p></div>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script>
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

const REPO = "adrianbds/resenha-caixa";
const ARQUIVO = "dados.json";
const CHAVE_TOKEN = "resenha-caixa-token";
const VALOR_MENSAL = 60;
const VALOR_AVULSO = 20;
const VAZIO = { mensalistas: {}, meses: {} };

const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const chaveMes = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const MES_ATUAL = chaveMes(new Date());
const dataDoMes = (k) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1); };
const nomeMes = (k) => dataDoMes(k).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
const mesVizinho = (k, d) => { const x = dataDoMes(k); return chaveMes(new Date(x.getFullYear(), x.getMonth() + d, 1)); };
const dataCurta = (iso) => iso ? new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : "";
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iniciais = (nome) => {
  const p = nome.trim().split(/\s+/);
  return ((p[0]?.[0] || "") + (p.length > 1 ? p[p.length - 1][0] : (p[0]?.[1] || ""))).toUpperCase();
};

const lerToken = () => { try { return localStorage.getItem(CHAVE_TOKEN) || ""; } catch { return ""; } };
const salvarToken = (t) => { try { t ? localStorage.setItem(CHAVE_TOKEN, t) : localStorage.removeItem(CHAVE_TOKEN); } catch {} };

// --- GitHub: os dados moram em dados.json no repositório; cada mudança vira um commit ---
const b64ParaTexto = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), (c) => c.charCodeAt(0)));
const textoParaB64 = (txt) => { let s = ""; new TextEncoder().encode(txt).forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); };
const cabecalhos = (token) => ({ Accept: "application/vnd.github+json", ...(token ? { Authorization: "Bearer " + token } : {}) });

async function baixar(token) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${ARQUIVO}?ref=main&t=${Date.now()}`, { headers: cabecalhos(token), cache: "no-store" });
  if (r.ok) { const j = await r.json(); return { dados: JSON.parse(b64ParaTexto(j.content)), sha: j.sha }; }
  if (r.status === 401 && token) throw { code: "token" };
  // Limite de leitura da API (visitantes): cai para o arquivo bruto.
  const r2 = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${ARQUIVO}?t=${Date.now()}`, { cache: "no-store" });
  if (!r2.ok) throw { code: "rede" };
  return { dados: await r2.json(), sha: null };
}

async function enviar(token, alterar, mensagem) {
  for (let tentativa = 0; tentativa < 3; tentativa++) {
    const { dados, sha } = await baixar(token);
    const novo = structuredClone({ ...VAZIO, ...dados });
    alterar(novo);
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${ARQUIVO}`, {
      method: "PUT", headers: { ...cabecalhos(token), "Content-Type": "application/json" },
      body: JSON.stringify({ message: mensagem, content: textoParaB64(JSON.stringify(novo, null, 1) + "\n"), sha, branch: "main" }),
    });
    if (r.ok) return novo;
    if (r.status === 401 || r.status === 403 || r.status === 404) throw { code: "token" };
    if (r.status !== 409 && r.status !== 422) throw { code: "rede" };
    // 409/422: alguém salvou no meio; baixa de novo e reaplica.
  }
  throw { code: "conflito" };
}

// --- Regras do caixa ---
// Mensalista aparece no mês se já tinha entrado e ainda não tinha saído (ou se pagou naquele mês).
const ativoNoMes = (m, k, pagos) => (m.desde <= k && (!m.removidoEm || k < m.removidoEm)) || !!pagos[m.id];

function resumoMes(k, mensalistas, docMes) {
  const pagos = docMes?.mensal || {};
  const avulsos = Object.values(docMes?.avulsos || {});
  const mens = mensalistas.filter((m) => ativoNoMes(m, k, pagos));
  const mensPagos = mens.filter((m) => pagos[m.id]);
  const avPagos = avulsos.filter((a) => a.pago);
  const recebido = mensPagos.reduce((s, m) => s + (pagos[m.id].valor ?? VALOR_MENSAL), 0) + avPagos.reduce((s, a) => s + (a.valor ?? VALOR_AVULSO), 0);
  const pendente = (mens.length - mensPagos.length) * VALOR_MENSAL + avulsos.filter((a) => !a.pago).reduce((s, a) => s + (a.valor ?? VALOR_AVULSO), 0);
  return { pagos: mensPagos.length + avPagos.length, devendo: mens.length - mensPagos.length + avulsos.length - avPagos.length,
    recebido, pendente, nMens: mens.length, nAv: avulsos.length };
}

// --- Componentes ---
function Confirma({ texto, onSim, onNao }) {
  return html`<div class="confirma">${texto}
    <button class="sim" onClick=${onSim}>Sim</button>
    <button onClick=${onNao}>Não</button></div>`;
}

function Linha({ nome, sub, pago, admin, onPagar, onDesfazer, onRemover }) {
  const [pergunta, setPergunta] = useState(null);
  let acoes = null;
  if (admin) {
    if (pergunta === "desfazer") acoes = html`<${Confirma} texto="Desfazer?" onSim=${() => { setPergunta(null); onDesfazer(); }} onNao=${() => setPergunta(null)} />`;
    else if (pergunta === "remover") acoes = html`<${Confirma} texto="Remover?" onSim=${() => { setPergunta(null); onRemover(); }} onNao=${() => setPergunta(null)} />`;
    else acoes = html`<div class="acoes">
      <button class=${"btn-pago" + (pago ? " ok" : "")} onClick=${() => pago ? setPergunta("desfazer") : onPagar()}
        aria-label=${pago ? `${nome} pagou. Clique para desfazer` : `Marcar ${nome} como pago`}>${pago ? "Pago ✓" : "Pago"}</button>
      <button class="btn-x" title="Remover" aria-label=${`Remover ${nome}`} onClick=${() => setPergunta("remover")}>✕</button>
    </div>`;
  }
  return html`<li class=${pago ? "ok" : ""}>
    <span class=${"ava" + (pago ? " ok" : "")} aria-hidden="true">${iniciais(nome)}</span>
    <div class="quem"><div class=${"n" + (pago ? " ok" : "")}>${nome}</div><div class="s">${sub}</div></div>
    ${acoes}
  </li>`;
}

function Painel({ titulo, preco, idInput, itens, vazio, onAdd, admin, total }) {
  const [nome, setNome] = useState("");
  const enviarNome = (e) => {
    e.preventDefault();
    const n = nome.trim().replace(/\s+/g, " ");
    if (!n) return;
    onAdd(n);
    setNome("");
  };
  return html`<section class="painel">
    <div class="painel-cab"><h2>${titulo}</h2><span class="preco num">${preco}</span></div>
    ${admin && html`<form class="add" onSubmit=${enviarNome}>
      <input id=${idInput} placeholder="Nome do jogador" value=${nome} maxLength="60"
        onInput=${(e) => setNome(e.target.value)} autocomplete="off" />
      <button type="submit" disabled=${!nome.trim()}>Adicionar</button>
    </form>`}
    ${itens.length ? html`<ul class="lista">${itens}</ul>` : html`<div class="vazio">${vazio}</div>`}
    <div class="rodape num"><span>${total.pagos} de ${total.n} pagaram</span><b>${brl(total.valor)}</b></div>
  </section>`;
}

function Login({ onEntrar, onCancelar }) {
  const [t, setT] = useState("");
  const [msg, setMsg] = useState("");
  const [testando, setTestando] = useState(false);
  const testar = async (e) => {
    e.preventDefault();
    setTestando(true); setMsg("");
    try {
      // Gravação vazia de propósito: token com escrita recebe 422 (faltam campos), sem escrita recebe 403. Nada é gravado.
      const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${ARQUIVO}`, {
        method: "PUT", headers: { ...cabecalhos(t.trim()), "Content-Type": "application/json" }, body: "{}" });
      if (r.status === 422) onEntrar(t.trim());
      else if (r.status === 401) setMsg("Token inválido. Copie de novo, ele começa com github_pat_.");
      else setMsg("Esse token só tem leitura. Na linha do Contents, mude o Access de Read-only para Read and write.");
    } catch { setMsg("Sem conexão com o GitHub. Tente de novo."); }
    setTestando(false);
  };
  return html`<form class="login" onSubmit=${testar}>
    <h2>Entrar para editar</h2>
    <ol>
      <li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> logado como <code>adrianbds</code>.</li>
      <li>Dê um nome (ex.: <code>caixa resenha</code>) e em <b>Expiration</b> escolha <b>No expiration</b>.</li>
      <li>Em <b>Repository access</b> marque <b>Only select repositories</b> → <code>resenha-caixa</code>. Em <b>Permissions</b> clique em <b>Add permissions</b> e marque <b>Contents</b>. Na linha do Contents que aparece, mude o <b>Access</b> de <b>Read-only</b> para <b>Read and write</b>.</li>
      <li>Clique em <b>Generate token</b>, copie e cole aqui. Ele fica só neste aparelho.</li>
    </ol>
    <div class="linha">
      <input id="token" type="password" placeholder="github_pat_..." value=${t} onInput=${(e) => setT(e.target.value)} autocomplete="off" />
      <button class="entrar" type="submit" disabled=${!t.trim() || testando}>${testando ? "Conferindo…" : "Entrar"}</button>
      <button class="cancela" type="button" onClick=${onCancelar}>Cancelar</button>
    </div>
    ${msg && html`<div class="aviso">${msg}</div>`}
  </form>`;
}

function App() {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState("");
  const [token, setToken] = useState(lerToken);
  const [loginAberto, setLoginAberto] = useState(false);
  const [salvando, setSalvando] = useState(0);
  const [mes, setMes] = useState(MES_ATUAL);
  const [filtro, setFiltro] = useState("todos");
  const [busca, setBusca] = useState("");
  const fila = useRef(Promise.resolve());
  const salvandoRef = useRef(0);
  salvandoRef.current = salvando;
  const admin = !!token;

  const recarregar = useCallback(async () => {
    try { const { dados } = await baixar(token); setDados({ ...VAZIO, ...dados }); setErro(""); }
    catch (e) {
      if (e.code === "token") { salvarToken(""); setToken(""); setErro("O token de edição expirou ou foi apagado. Entre de novo para editar."); }
      else setErro("Não consegui buscar os dados. Confira a internet; a página tenta de novo sozinha.");
    }
  }, [token]);

  useEffect(() => { recarregar(); }, [recarregar]);
  useEffect(() => {
    const atualizar = () => { if (!document.hidden && salvandoRef.current === 0) recarregar(); };
    const id = setInterval(atualizar, 90000);
    document.addEventListener("visibilitychange", atualizar);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", atualizar); };
  }, [recarregar]);

  // Mostra a mudança na hora e grava no GitHub em seguida, uma por vez.
  const mudar = (alterar, mensagem) => {
    setDados((d) => { const n = structuredClone(d); alterar(n); return n; });
    setSalvando((s) => s + 1);
    fila.current = fila.current
      .then(() => enviar(token, alterar, mensagem))
      .then((novo) => { setErro(""); if (salvandoRef.current <= 1) setDados(novo); })
      .catch((e) => {
        if (e?.code === "token") { salvarToken(""); setToken(""); setErro("Não salvou: o token de edição não vale mais. Entre de novo e repita."); }
        else setErro("Não salvou a última mudança. Confira a internet e repita.");
        recarregar();
      })
      .finally(() => setSalvando((s) => s - 1));
  };

  const doMes = (n) => (n.meses[mes] ||= { mensal: {}, avulsos: {} });
  const rotMes = nomeMes(mes);
  const agora = () => new Date().toISOString();

  const mensalistas = useMemo(() => Object.entries(dados?.mensalistas || {}).map(([id, m]) => ({ id, ...m })), [dados]);
  const meses = dados?.meses || {};
  const docMes = meses[mes] || {};
  const pagosMensal = docMes.mensal || {};

  const listaMeses = useMemo(() => {
    const s = new Set([MES_ATUAL, ...Object.keys(meses)]);
    mensalistas.forEach((m) => m.desde && s.add(m.desde));
    // Preenche os meses do meio, para o filtro não pular nenhum.
    const ord = [...s].filter((k) => k <= MES_ATUAL).sort();
    const tudo = [];
    for (let k = ord[0]; k <= MES_ATUAL; k = mesVizinho(k, 1)) tudo.push(k);
    return tudo.reverse();
  }, [meses, mensalistas]);

  const passa = (nome, pago) => (filtro === "todos" || (filtro === "pagos") === pago) && (!busca || nome.toLowerCase().includes(busca.toLowerCase()));
  const mensDoMes = mensalistas.filter((m) => ativoNoMes(m, mes, pagosMensal)).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  const avDoMes = Object.entries(docMes.avulsos || {}).map(([id, a]) => ({ id, ...a })).sort((a, b) => (a.criadoEm || "").localeCompare(b.criadoEm || ""));
  const r = resumoMes(mes, mensalistas, docMes);
  const esperado = r.recebido + r.pendente;
  const pct = esperado ? Math.round((r.recebido / esperado) * 100) : 0;

  const cabecalho = html`<header class="topo">
    <div class="marca">
      <img src="logo.jpg" alt="Escudo da Resenha Jaguariúna" width="84" height="84" />
      <div><h1 class="ouro">Resenha Jaguariúna</h1><div class="sub">Caixa do futebol</div></div>
    </div>
    <div class="direita">
      ${dados && html`<div class="mes-nav">
        <button aria-label="Mês anterior" onClick=${() => setMes(mesVizinho(mes, -1))}>‹</button>
        <select id="mes" aria-label="Escolher mês" value=${mes} onChange=${(e) => setMes(e.target.value)}>
          ${(listaMeses.includes(mes) ? listaMeses : [mes, ...listaMeses]).map((k) => html`<option key=${k} value=${k}>${nomeMes(k)}</option>`)}
        </select>
        <button aria-label="Próximo mês" disabled=${mes >= MES_ATUAL} onClick=${() => setMes(mesVizinho(mes, 1))}>›</button>
      </div>`}
      <div class="acesso">
        ${admin
          ? html`<span class="modo admin">${salvando ? "Salvando…" : "Editando"}</span><button class="link-btn" onClick=${() => { salvarToken(""); setToken(""); }}>Sair</button>`
          : html`<span class="modo">Só leitura</span><button class="link-btn" onClick=${() => setLoginAberto(true)}>Entrar para editar</button>`}
      </div>
    </div>
  </header>`;

  if (!dados) return html`${cabecalho}${erro ? html`<div class="aviso">${erro}</div>` : html`<p class="info">Carregando o caixa…</p>`}`;

  return html`
    ${cabecalho}
    ${loginAberto && !admin && html`<${Login} onEntrar=${(t) => { salvarToken(t); setToken(t); setLoginAberto(false); }} onCancelar=${() => setLoginAberto(false)} />`}
    ${erro && html`<div class="aviso" role="alert">${erro}</div>`}
    ${mes !== MES_ATUAL && html`<p class="info">Vendo ${rotMes}.${admin ? " Dá para marcar pagamento atrasado aqui; o mês atual não muda." : ""}</p>`}

    <section class="placar" aria-label="Resumo do mês">
      <div><span class="rot">Pagos × Devendo</span>
        <div class="score num"><span class="p">${r.pagos}</span><span class="x">×</span><span class="d">${r.devendo}</span></div></div>
      <div><span class="rot">Recebido</span><span class="val num ouro">${brl(r.recebido)}</span>
        <div class="barra" role="progressbar" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100"><i style=${{ width: pct + "%" }}></i></div>
        <span class="det num">${pct}% do esperado</span></div>
      <div><span class="rot">Falta receber</span><span class="val num">${brl(r.pendente)}</span>
        <span class="det num">de ${brl(esperado)} no mês</span></div>
      <div><span class="rot">Elenco do mês</span><span class="val num">${r.nMens + r.nAv}</span>
        <span class="det num">${r.nMens} mensais · ${r.nAv} avulsos</span></div>
    </section>

    <div class="filtros" role="group" aria-label="Filtrar">
      ${[["todos", "Todos"], ["pagos", "Quem pagou"], ["devendo", "Quem deve"]].map(([v, t]) =>
        html`<button key=${v} class="chip" aria-pressed=${filtro === v} onClick=${() => setFiltro(v)}>${t}</button>`)}
      <input id="busca" type="search" placeholder="Buscar jogador" value=${busca} onInput=${(e) => setBusca(e.target.value)} />
    </div>

    <div class="tabelas">
      <${Painel} titulo="Mensais" preco=${brl(VALOR_MENSAL) + " / mês"} idInput="novo-mensal" admin=${admin}
        vazio=${admin ? "Nenhum mensalista ainda. Digite o nome acima para adicionar." : "Nenhum mensalista neste mês."}
        total=${{ pagos: mensDoMes.filter((m) => pagosMensal[m.id]).length, n: mensDoMes.length,
                  valor: mensDoMes.filter((m) => pagosMensal[m.id]).reduce((s, m) => s + (pagosMensal[m.id].valor ?? VALOR_MENSAL), 0) }}
        onAdd=${(nome) => mudar((n) => { n.mensalistas[novoId()] = { nome, desde: mes, criadoEm: agora() }; }, `Novo mensalista: ${nome}`)}
        itens=${mensDoMes.filter((m) => passa(m.nome, !!pagosMensal[m.id])).map((m) => html`<${Linha} key=${m.id}
          nome=${m.nome} pago=${!!pagosMensal[m.id]} admin=${admin}
          sub=${pagosMensal[m.id] ? "Pagou em " + dataCurta(pagosMensal[m.id].em) : "Pendente · " + brl(VALOR_MENSAL)}
          onPagar=${() => mudar((n) => { doMes(n).mensal[m.id] = { nome: m.nome, valor: VALOR_MENSAL, em: agora() }; }, `Pagou mensal: ${m.nome} (${rotMes})`)}
          onDesfazer=${() => mudar((n) => { delete doMes(n).mensal[m.id]; }, `Desfez mensal: ${m.nome} (${rotMes})`)}
          onRemover=${() => mudar((n) => { if (n.mensalistas[m.id]) n.mensalistas[m.id].removidoEm = mes; }, `Saiu dos mensalistas: ${m.nome} (${rotMes})`)} />`)} />

      <${Painel} titulo="Avulsos" preco=${brl(VALOR_AVULSO) + " / jogo"} idInput="novo-avulso" admin=${admin}
        vazio=${admin ? "Nenhum avulso neste mês. Adicione o nome a cada jogo que a pessoa jogar." : "Nenhum avulso neste mês."}
        total=${{ pagos: avDoMes.filter((a) => a.pago).length, n: avDoMes.length,
                  valor: avDoMes.filter((a) => a.pago).reduce((s, a) => s + (a.valor ?? VALOR_AVULSO), 0) }}
        onAdd=${(nome) => mudar((n) => { doMes(n).avulsos[novoId()] = { nome, pago: false, valor: VALOR_AVULSO, criadoEm: agora() }; }, `Avulso: ${nome} (${rotMes})`)}
        itens=${avDoMes.filter((a) => passa(a.nome, !!a.pago)).map((a) => html`<${Linha} key=${a.id}
          nome=${a.nome} pago=${!!a.pago} admin=${admin}
          sub=${(a.pago ? "Pagou em " + dataCurta(a.em) : "Pendente · " + brl(a.valor ?? VALOR_AVULSO)) + " · jogo de " + dataCurta(a.criadoEm)}
          onPagar=${() => mudar((n) => { const x = doMes(n).avulsos[a.id]; if (x) { x.pago = true; x.em = agora(); } }, `Pagou avulso: ${a.nome} (${rotMes})`)}
          onDesfazer=${() => mudar((n) => { const x = doMes(n).avulsos[a.id]; if (x) { x.pago = false; x.em = null; } }, `Desfez avulso: ${a.nome} (${rotMes})`)}
          onRemover=${() => mudar((n) => { delete doMes(n).avulsos[a.id]; }, `Tirou avulso: ${a.nome} (${rotMes})`)} />`)} />
    </div>

    <section class="hist">
      <div class="painel-cab"><h2>Histórico</h2><span class="info">Clique num mês para abrir</span></div>
      <div class="hist-wrap"><table>
        <thead><tr><th>Mês</th><th>Pagos</th><th>Devendo</th><th>Recebido</th><th>Falta</th></tr></thead>
        <tbody>${listaMeses.map((k) => {
          const h = resumoMes(k, mensalistas, meses[k]);
          return html`<tr key=${k} class=${"click" + (k === mes ? " atual" : "")} tabIndex="0"
            onClick=${() => { setMes(k); window.scrollTo({ top: 0, behavior: "smooth" }); }}
            onKeyDown=${(e) => e.key === "Enter" && setMes(k)}>
            <td class="mes">${nomeMes(k)}</td>
            <td class="num" style=${{ color: "var(--pago)" }}>${h.pagos}</td>
            <td class="num" style=${{ color: h.devendo ? "var(--deve)" : "var(--muted)" }}>${h.devendo}</td>
            <td class="num" style=${{ color: "var(--gold)" }}>${brl(h.recebido)}</td>
            <td class="num">${brl(h.pendente)}</td></tr>`;
        })}</tbody>
      </table></div>
    </section>
    <p class="info centro">Cada pagamento fica gravado no histórico do GitHub. Limpar o cache não apaga nada. Todo mês novo os mensais começam devendo.</p>
  `;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
</body>
</html>
